<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff6b2c">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <title>픽업노트 - 라이더가 남기는 가게 기록</title>
    <style>
        :root {
            --bg: #f5f4f1;
            --card: #fff;
            --border: #e4e1da;
            --text: #1b1a17;
            --text2: #605d55;
            --text3: #97948b;
            --accent: #ff6b2c;
            --accent-soft: #fff0e8;
            --good: #1f8a5b;
            --good-soft: #e5f5ec;
            --bad: #d23c3c;
            --bad-soft: #fdeaea;
            --warn: #c98612;
            --warn-soft: #fdf3dd;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
            --nav-h: 64px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151513;
                --card: #201f1c;
                --border: #33312c;
                --text: #f1efe9;
                --text2: #b5b1a7;
                --text3: #7d7a72;
                --accent: #ff7a40;
                --accent-soft: #3a2418;
                --good: #4cc38a;
                --good-soft: #17301f;
                --bad: #ff6b6b;
                --bad-soft: #3a1b1b;
                --warn: #f0b440;
                --warn-soft: #3a2e14;
                --shadow: 0 1px 2px rgba(0,0,0,.3);
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
        }
        button, input, select, textarea { font: inherit; color: inherit; }
        a { color: inherit; }

        /* 상단 바 */
        .topbar {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .topbar .back { display: none; border: 0; background: none; font-size: 22px; padding: 0 4px 0 0; cursor: pointer; }
        .topbar.sub .back { display: block; }
        .topbar h1 { margin: 0; font-size: 18px; font-weight: 800; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topbar h1 .logo { color: var(--accent); }
        .nick {
            border: 1px solid var(--border); background: var(--card);
            border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--text2); cursor: pointer;
            display: flex; align-items: center; gap: 4px;
        }

        main { max-width: 640px; margin: 0 auto; padding: 16px; }
        .notice {
            font-size: 12.5px; color: var(--text2);
            background: var(--warn-soft); border-radius: var(--radius-sm);
            padding: 10px 12px; margin-bottom: 16px;
            display: flex; gap: 8px;
        }
        .notice i { color: var(--warn); font-size: 16px; }

        h2 { font-size: 16px; margin: 24px 0 10px; display: flex; align-items: center; justify-content: space-between; }
        h2:first-child { margin-top: 0; }
        h2 .more { font-size: 13px; font-weight: 500; color: var(--text3); text-decoration: none; }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
        }
        .list { display: flex; flex-direction: column; gap: 10px; }
        .clickable { cursor: pointer; text-decoration: none; display: block; }
        .clickable:active { transform: scale(.99); }

        .hero {
            background: linear-gradient(135deg, var(--accent), #ff9a3c);
            color: #fff; border-radius: var(--radius); padding: 18px;
        }
        .hero h3 { margin: 0 0 4px; font-size: 19px; }
        .hero p { margin: 0 0 14px; opacity: .92; font-size: 14px; }
        .hero .btn { background: #fff; color: var(--accent); }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
        .stat b { display: block; font-size: 20px; }
        .stat span { font-size: 12px; color: var(--text3); }

        .btn {
            border: 0; border-radius: var(--radius-sm); padding: 11px 16px;
            background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            text-decoration: none;
        }
        .btn.block { width: 100%; }
        .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        .btn:disabled { opacity: .5; cursor: default; }

        /* 가게 카드 */
        .store-head { display: flex; align-items: flex-start; gap: 10px; }
        .store-head .name { font-weight: 700; font-size: 16px; }
        .store-head .meta { font-size: 12.5px; color: var(--text3); }
        .score {
            margin-left: auto; flex-shrink: 0;
            min-width: 48px; text-align: center; border-radius: 10px; padding: 4px 8px;
            font-weight: 800; font-size: 17px;
        }
        .score small { display: block; font-size: 10.5px; font-weight: 600; }
        .lv-good { background: var(--good-soft); color: var(--good); }
        .lv-mid { background: var(--warn-soft); color: var(--warn); }
        .lv-bad { background: var(--bad-soft); color: var(--bad); }
        .kv { display: flex; gap: 14px; font-size: 13px; color: var(--text2); margin-top: 8px; flex-wrap: wrap; }
        .kv i { color: var(--text3); }

        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag {
            font-size: 12px; padding: 3px 9px; border-radius: 999px;
            background: var(--bg); border: 1px solid var(--border); color: var(--text2);
        }
        .tag.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
        .tag.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
        .tag .n { font-weight: 700; margin-left: 2px; }

        /* 검색 */
        .search { position: relative; margin-bottom: 12px; }
        .search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 18px; }
        .search input {
            width: 100%; padding: 12px 12px 12px 38px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card); outline: none;
        }
        .search input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
        .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0; border: 1px solid var(--border); background: var(--card);
            border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text2);
        }
        .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }

        /* 폼 */
        .field { margin-bottom: 16px; }
        .field > label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
        .field > label .opt { font-weight: 400; color: var(--text3); font-size: 12.5px; }
        .field input, .field select, .field textarea {
            width: 100%; padding: 11px 12px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card); outline: none;
        }
        .field textarea { min-height: 110px; resize: vertical; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hint { font-size: 12.5px; color: var(--text3); margin-top: 6px; }
        .rating { display: flex; gap: 6px; }
        .rating button {
            flex: 1; border: 1px solid var(--border); background: var(--card);
            border-radius: var(--radius-sm); padding: 8px 0; cursor: pointer; font-size: 12px; color: var(--text2);
        }
        .rating button b { display: block; font-size: 18px; }
        .rating button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
        .toggle-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .toggle-tags button {
            border: 1px solid var(--border); background: var(--card); border-radius: 999px;
            padding: 6px 11px; font-size: 13px; cursor: pointer; color: var(--text2);
        }
        .toggle-tags.bad button.on { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
        .toggle-tags.good button.on { background: var(--good-soft); color: var(--good); border-color: var(--good); }
        .sub-label { font-size: 12.5px; color: var(--text3); margin: 8px 0 6px; }

        /* 제보/글 */
        .report .top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text3); }
        .report .top .who { color: var(--text2); font-weight: 600; }
        .report .memo { margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
        .mini-score { font-weight: 800; border-radius: 6px; padding: 1px 7px; font-size: 13px; }

        .post .cat { font-size: 12px; font-weight: 700; color: var(--accent); }
        .post .title { font-weight: 700; font-size: 15.5px; margin: 2px 0 4px; }
        .post .excerpt { color: var(--text2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post .foot { display: flex; gap: 12px; font-size: 12.5px; color: var(--text3); margin-top: 8px; }
        .post-body { white-space: pre-wrap; word-break: break-word; margin: 12px 0; }
        .like {
            border: 1px solid var(--border); background: var(--card); border-radius: 999px;
            padding: 7px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
        }
        .like.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .comment { padding: 10px 0; border-top: 1px solid var(--border); }
        .comment:first-child { border-top: 0; }
        .comment .who { font-size: 13px; font-weight: 600; color: var(--text2); }
        .comment .who span { font-weight: 400; color: var(--text3); margin-left: 6px; }
        .comment p { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; }
        .comment-form { display: flex; gap: 8px; margin-top: 10px; }
        .comment-form input { flex: 1; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); outline: none; }

        .guide h3 { margin: 0 0 6px; font-size: 15.5px; display: flex; gap: 8px; align-items: center; }
        .guide h3 i { color: var(--accent); font-size: 20px; }
        .guide ul { margin: 0; padding-left: 20px; color: var(--text2); }
        .guide li { margin: 3px 0; }

        .empty { text-align: center; color: var(--text3); padding: 36px 16px; }
        .empty i { font-size: 36px; display: block; margin-bottom: 8px; }

        .fab {
            position: fixed; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
            width: 54px; height: 54px; border-radius: 50%; border: 0;
            background: var(--accent); color: #fff; font-size: 26px; cursor: pointer;
            box-shadow: 0 6px 18px rgba(255,107,44,.4); display: none; align-items: center; justify-content: center;
            text-decoration: none;
        }
        .fab.show { display: flex; }

        /* 하단 탭 */
        nav.tabs {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
            display: flex; background: var(--card); border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom);
        }
        nav.tabs a {
            flex: 1; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; font-size: 11px; color: var(--text3); gap: 2px;
        }
        nav.tabs a i { font-size: 23px; }
        nav.tabs a.on { color: var(--accent); font-weight: 700; }
        nav.tabs a.center i {
            background: var(--accent); color: #fff; width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .toast {
            position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px); transform: translateX(-50%) translateY(20px);
            background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px;
            opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100% - 32px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <header class="topbar" id="topbar">
        <button class="back" onclick="history.length > 1 ? history.back() : go('#home')" aria-label="뒤로"><i class="ti ti-chevron-left"></i></button>
        <h1 id="title"><span class="logo">●</span> 픽업노트</h1>
        <button class="nick" id="nickBtn" onclick="changeNick()"><i class="ti ti-helmet"></i><span id="nickText"></span></button>
    </header>

    <main id="view"></main>

    <a class="fab" id="fab" href="#write" aria-label="글쓰기"><i class="ti ti-pencil"></i></a>

    <nav class="tabs" id="tabs">
        <a href="#home" data-tab="home"><i class="ti ti-home"></i>홈</a>
        <a href="#stores" data-tab="stores"><i class="ti ti-building-store"></i>가게</a>
        <a href="#report" data-tab="report" class="center"><i class="ti ti-plus"></i>제보</a>
        <a href="#board" data-tab="board"><i class="ti ti-messages"></i>커뮤니티</a>
        <a href="#guide" data-tab="guide"><i class="ti ti-shield-check"></i>대처법</a>
    </nav>

    <div class="toast" id="toast"></div>

    <script>
        // ─── 상수 ─────────────────────────────────────────────
        const BAD_TAGS = ['조리 지연 방치', '반말·막말', '픽업 위치 안내 없음', '화장실 사용 거부', '대기 공간 없음', '누락·파손 책임 전가', '주차 막음', '엘리베이터 이용 제한', '재촉·호출 무시', '포장 부실'];
        const GOOD_TAGS = ['친절해요', '조리 시간 정확', '대기 공간 있음', '물·음료 제공', '포장 꼼꼼', '픽업대 정리 잘됨'];
        const CATEGORIES = ['치킨', '피자', '한식', '중식', '일식', '분식', '카페·디저트', '패스트푸드', '족발·보쌈', '기타'];
        const BOARD_CATS = ['자유', '피해 공유', '질문', '꿀팁'];
        const KEY = 'pickupNote.v1';

        // ─── 저장소 (이 기기 브라우저에만 저장되는 임시 버전) ───
        function load() {
            try {
                const raw = localStorage.getItem(KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return seed();
        }
        function save() {
            try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
        }
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

        function seed() {
            const h = 3600e3, now = Date.now();
            const r = (store, area, category, wait, score, bad, good, memo, ago, author) =>
                ({ id: uid(), store, area, category, wait, score, bad, good, memo, at: now - ago * h, author, sample: true });
            return {
                nick: '라이더' + Math.floor(1000 + Math.random() * 9000),
                reports: [
                    r('(예시) 행복치킨 역삼점', '강남구 역삼동', '치킨', 25, 1, ['조리 지연 방치', '반말·막말', '대기 공간 없음'], [], '콜 받고 도착했는데 그때부터 조리 시작. 20분 넘게 밖에서 기다렸고 언제 되냐 물으니 짜증 냄.', 3, '라이더7712'),
                    r('(예시) 행복치킨 역삼점', '강남구 역삼동', '치킨', 18, 2, ['조리 지연 방치', '픽업 위치 안내 없음'], [], '뒷문으로 오라는데 안내가 없어서 한참 헤맴.', 26, '역삼라이더'),
                    r('(예시) 온기분식', '마포구 서교동', '분식', 3, 5, [], ['친절해요', '조리 시간 정확', '물·음료 제공'], '더운 날 물 주심. 항상 픽업대에 준비돼 있음.', 5, '홍대바이크'),
                    r('(예시) 온기분식', '마포구 서교동', '분식', 5, 4, [], ['조리 시간 정확', '포장 꼼꼼'], '', 50, '라이더3021'),
                    r('(예시) 빅피자 신림점', '관악구 신림동', '피자', 12, 3, ['주차 막음'], ['포장 꼼꼼'], '가게 앞 오토바이 세우면 뭐라고 함. 음식은 제때 나옴.', 9, '관악러'),
                    r('(예시) 달빛카페', '성동구 성수동', '카페·디저트', 8, 2, ['누락·파손 책임 전가', '포장 부실'], [], '음료 뚜껑이 제대로 안 닫혀 있었는데 쏟아진 걸 라이더 탓으로 돌림. 픽업 때 사진 꼭 찍으세요.', 30, '성수라이더'),
                ],
                posts: [
                    { id: uid(), cat: '꿀팁', title: '(예시) 파손 분쟁 피하려면 픽업 때 사진 한 장', body: '포장 상태를 받자마자 사진으로 남겨두면 나중에 책임 전가 당할 때 증거가 됩니다. 시간 찍히게 찍는 게 포인트.', author: '성수라이더', at: now - 7 * h, likes: 14, comments: [{ author: '라이더7712', body: '이거 진짜 중요함. 저도 한 번 덕 봤어요.', at: now - 6 * h }], sample: true },
                    { id: uid(), cat: '피해 공유', title: '(예시) 조리 대기 30분인데 배차 취소하면 패널티?', body: '가게가 조리를 늦게 시작해서 한참 기다렸는데, 이럴 때 다들 어떻게 하시나요? 플랫폼에 신고하면 반영이 되는지 궁금합니다.', author: '역삼라이더', at: now - 20 * h, likes: 8, comments: [], sample: true },
                ],
                liked: {},
            };
        }

        let db = load();
        if (!db.liked) db.liked = {};
        save();

        // ─── 유틸 ─────────────────────────────────────────────
        const $ = (s) => document.querySelector(s);
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function ago(t) {
            const m = Math.floor((Date.now() - t) / 60000);
            if (m < 1) return '방금';
            if (m < 60) return m + '분 전';
            const h = Math.floor(m / 60);
            if (h < 24) return h + '시간 전';
            const d = Math.floor(h / 24);
            if (d < 30) return d + '일 전';
            return new Date(t).toLocaleDateString('ko-KR');
        }
        function norm(s) { return String(s).replace(/\s+/g, '').toLowerCase(); }
        function storeKey(name, area) { return norm(name) + '@' + norm(area); }
        function level(score) { return score >= 3.8 ? 'good' : score >= 2.6 ? 'mid' : 'bad'; }
        function levelText(score) { return score >= 3.8 ? '좋음' : score >= 2.6 ? '보통' : '주의'; }
        function toast(msg) {
            const t = $('#toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove('show'), 2000);
        }
        function go(hash) { location.hash = hash; }

        // 제보를 가게 단위로 묶어 평균 점수·대기 시간·자주 나온 태그를 계산
        function stores() {
            const map = new Map();
            for (const r of db.reports) {
                const k = storeKey(r.store, r.area);
                if (!map.has(k)) map.set(k, { key: k, name: r.store, area: r.area, category: r.category, reports: [] });
                map.get(k).reports.push(r);
            }
            return [...map.values()].map((s) => {
                const n = s.reports.length;
                const count = (field) => {
                    const c = {};
                    s.reports.forEach((r) => r[field].forEach((t) => (c[t] = (c[t] || 0) + 1)));
                    return Object.entries(c).sort((a, b) => b[1] - a[1]);
                };
                s.reports.sort((a, b) => b.at - a.at);
                return {
                    ...s,
                    count: n,
                    score: s.reports.reduce((a, r) => a + r.score, 0) / n,
                    wait: Math.round(s.reports.reduce((a, r) => a + r.wait, 0) / n),
                    bad: count('bad'),
                    good: count('good'),
                    last: s.reports[0].at,
                };
            });
        }

        // ─── 화면 조각 ────────────────────────────────────────
        function storeCard(s) {
            const lv = level(s.score);
            const tags = [
                ...s.bad.slice(0, 3).map(([t, n]) => `<span class="tag bad">${esc(t)}<span class="n">${n}</span></span>`),
                ...s.good.slice(0, 2).map(([t, n]) => `<span class="tag good">${esc(t)}<span class="n">${n}</span></span>`),
            ].join('');
            return `
            <a class="card clickable" href="#store/${encodeURIComponent(s.key)}">
                <div class="store-head">
                    <div>
                        <div class="name">${esc(s.name)}</div>
                        <div class="meta">${esc(s.area)} · ${esc(s.category)}</div>
                    </div>
                    <div class="score lv-${lv}">${s.score.toFixed(1)}<small>${levelText(s.score)}</small></div>
                </div>
                <div class="kv">
                    <span><i class="ti ti-clock"></i> 평균 대기 ${s.wait}분</span>
                    <span><i class="ti ti-message-report"></i> 제보 ${s.count}건</span>
                    <span><i class="ti ti-calendar"></i> ${ago(s.last)}</span>
                </div>
                ${tags ? `<div class="tags">${tags}</div>` : ''}
            </a>`;
        }

        function reportCard(r, showStore) {
            const lv = level(r.score);
            return `
            <div class="card report">
                <div class="top">
                    <span class="mini-score lv-${lv}">${r.score}점</span>
                    <span class="who">${esc(r.author)}</span>
                    <span>· ${ago(r.at)}</span>
                    <span style="margin-left:auto"><i class="ti ti-clock"></i> ${r.wait}분</span>
                </div>
                ${showStore ? `<div style="margin-top:6px;font-weight:700">${esc(r.store)} <span style="font-weight:400;color:var(--text3);font-size:13px">${esc(r.area)}</span></div>` : ''}
                <div class="tags">
                    ${r.bad.map((t) => `<span class="tag bad">${esc(t)}</span>`).join('')}
                    ${r.good.map((t) => `<span class="tag good">${esc(t)}</span>`).join('')}
                </div>
                ${r.memo ? `<div class="memo">${esc(r.memo)}</div>` : ''}
            </div>`;
        }

        function postCard(p) {
            return `
            <a class="card clickable post" href="#post/${p.id}">
                <div class="cat">${esc(p.cat)}</div>
                <div class="title">${esc(p.title)}</div>
                <div class="excerpt">${esc(p.body)}</div>
                <div class="foot">
                    <span>${esc(p.author)}</span><span>${ago(p.at)}</span>
                    <span><i class="ti ti-heart"></i> ${p.likes}</span>
                    <span><i class="ti ti-message"></i> ${p.comments.length}</span>
                </div>
            </a>`;
        }

        function empty(icon, text) {
            return `<div class="empty"><i class="ti ti-${icon}"></i>${text}</div>`;
        }

        const NOTICE = `<div class="notice"><i class="ti ti-info-circle"></i><div>시험용 버전이에요. 지금은 글과 제보가 <b>이 기기에만</b> 저장되고 다른 라이더에게는 보이지 않아요. '(예시)' 항목은 샘플입니다.</div></div>`;

        // ─── 페이지 ───────────────────────────────────────────
        const pages = {
            home() {
                const all = stores();
                const warn = all.filter((s) => s.score < 2.6).sort((a, b) => a.score - b.score).slice(0, 3);
                const best = all.filter((s) => s.score >= 3.8).sort((a, b) => b.score - a.score).slice(0, 3);
                const recent = [...db.reports].sort((a, b) => b.at - a.at).slice(0, 3);
                return `
                ${NOTICE}
                <div class="hero">
                    <h3>오늘 겪은 일, 한 줄이면 돼요</h3>
                    <p>가게에서 받은 대우를 기록하면 다음 라이더가 미리 알고 대비할 수 있어요.</p>
                    <a class="btn" href="#report"><i class="ti ti-plus"></i> 가게 제보하기</a>
                </div>
                <div class="stats">
                    <div class="stat"><b>${all.length}</b><span>기록된 가게</span></div>
                    <div class="stat"><b>${db.reports.length}</b><span>누적 제보</span></div>
                    <div class="stat"><b>${db.posts.length}</b><span>커뮤니티 글</span></div>
                </div>
                <h2>⚠️ 주의 가게 <a class="more" href="#stores">전체 보기</a></h2>
                <div class="list">${warn.map(storeCard).join('') || empty('mood-happy', '아직 주의 가게가 없어요')}</div>
                <h2>👍 라이더 대우 좋은 가게</h2>
                <div class="list">${best.map(storeCard).join('') || empty('building-store', '아직 기록이 없어요')}</div>
                <h2>최근 제보</h2>
                <div class="list">${recent.map((r) => reportCard(r, true)).join('') || empty('message-report', '첫 제보를 남겨주세요')}</div>`;
            },

            stores(q = '', filter = '전체') {
                let list = stores();
                if (q) list = list.filter((s) => norm(s.name + s.area).includes(norm(q)));
                if (filter === '주의') list = list.filter((s) => s.score < 2.6);
                else if (filter === '좋음') list = list.filter((s) => s.score >= 3.8);
                else if (filter !== '전체') list = list.filter((s) => s.category === filter);
                list.sort((a, b) => b.last - a.last);
                const chips = ['전체', '주의', '좋음', ...CATEGORIES]
                    .map((c) => `<button class="chip ${c === filter ? 'on' : ''}" onclick="pages.storesRender(null, '${c}')">${c}</button>`).join('');
                return `
                <div class="search"><i class="ti ti-search"></i>
                    <input id="q" type="search" placeholder="가게 이름이나 동네로 검색" value="${esc(q)}" oninput="pages.storesRender(this.value)">
                </div>
                <div class="chips">${chips}</div>
                <div class="list" id="storeList">${list.map(storeCard).join('') || empty('search', q ? '검색 결과가 없어요.<br>처음 가보는 가게라면 제보를 남겨주세요.' : '해당하는 가게가 없어요')}</div>`;
            },
            _q: '', _f: '전체',
            storesRender(q, f) {
                if (q !== null && q !== undefined) pages._q = q;
                if (f) pages._f = f;
                const focused = document.activeElement && document.activeElement.id === 'q';
                $('#view').innerHTML = pages.stores(pages._q, pages._f);
                if (focused) { const i = $('#q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
            },

            store(key) {
                const s = stores().find((x) => x.key === key);
                if (!s) return empty('building-store', '가게를 찾을 수 없어요');
                setTitle(s.name);
                const lv = level(s.score);
                const tagRow = (arr, cls) => arr.map(([t, n]) => `<span class="tag ${cls}">${esc(t)}<span class="n">${n}</span></span>`).join('');
                return `
                <div class="card">
                    <div class="store-head">
                        <div>
                            <div class="name" style="font-size:19px">${esc(s.name)}</div>
                            <div class="meta">${esc(s.area)} · ${esc(s.category)}</div>
                        </div>
                        <div class="score lv-${lv}">${s.score.toFixed(1)}<small>${levelText(s.score)}</small></div>
                    </div>
                    <div class="kv">
                        <span><i class="ti ti-clock"></i> 평균 대기 ${s.wait}분</span>
                        <span><i class="ti ti-message-report"></i> 제보 ${s.count}건</span>
                    </div>
                    ${s.bad.length ? `<div class="sub-label">이런 일이 있었어요</div><div class="tags" style="margin-top:0">${tagRow(s.bad, 'bad')}</div>` : ''}
                    ${s.good.length ? `<div class="sub-label">이런 점은 좋았어요</div><div class="tags" style="margin-top:0">${tagRow(s.good, 'good')}</div>` : ''}
                </div>
                <div style="margin-top:12px">
                    <a class="btn block" href="#report/${encodeURIComponent(s.key)}"><i class="ti ti-plus"></i> 이 가게 제보 추가</a>
                </div>
                <h2>제보 ${s.count}건</h2>
                <div class="list">${s.reports.map((r) => reportCard(r, false)).join('')}</div>`;
            },

            report(key) {
                const pre = key ? stores().find((x) => x.key === key) : null;
                form = { score: 0, bad: new Set(), good: new Set() };
                const tagBtns = (arr, type) => arr.map((t) => `<button type="button" onclick="toggleTag('${type}', this)">${esc(t)}</button>`).join('');
                return `
                <form onsubmit="submitReport(event)">
                    <div class="field">
                        <label>가게 이름</label>
                        <input name="store" required maxlength="40" placeholder="예) 행복치킨 역삼점" value="${pre ? esc(pre.name) : ''}">
                    </div>
                    <div class="row2">
                        <div class="field">
                            <label>동네</label>
                            <input name="area" required maxlength="30" placeholder="예) 강남구 역삼동" value="${pre ? esc(pre.area) : ''}">
                        </div>
                        <div class="field">
                            <label>업종</label>
                            <select name="category">${CATEGORIES.map((c) => `<option ${pre && pre.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
                        </div>
                    </div>
                    <div class="field">
                        <label>도착 후 기다린 시간</label>
                        <div class="row2" style="grid-template-columns:1fr auto;align-items:center">
                            <input name="wait" type="number" min="0" max="180" inputmode="numeric" placeholder="0" required>
                            <span>분</span>
                        </div>
                    </div>
                    <div class="field">
                        <label>라이더 대우는 어땠나요?</label>
                        <div class="rating" id="rating">
                            ${[['1', '최악'], ['2', '나쁨'], ['3', '보통'], ['4', '좋음'], ['5', '최고']].map(([n, t]) =>
                                `<button type="button" data-v="${n}" onclick="setScore(${n})"><b>${n}</b>${t}</button>`).join('')}
                        </div>
                    </div>
                    <div class="field">
                        <label>어떤 일이 있었나요? <span class="opt">(여러 개 선택)</span></label>
                        <div class="sub-label">불편했던 점</div>
                        <div class="toggle-tags bad">${tagBtns(BAD_TAGS, 'bad')}</div>
                        <div class="sub-label">좋았던 점</div>
                        <div class="toggle-tags good">${tagBtns(GOOD_TAGS, 'good')}</div>
                    </div>
                    <div class="field">
                        <label>자세한 내용 <span class="opt">(선택)</span></label>
                        <textarea name="memo" maxlength="500" placeholder="있었던 일을 사실대로 적어주세요."></textarea>
                        <div class="hint"><i class="ti ti-alert-triangle"></i> 직원 실명·전화번호 같은 개인정보나 욕설은 적지 말아주세요. 사실과 다른 내용은 문제가 될 수 있어요.</div>
                    </div>
                    <button class="btn block" type="submit"><i class="ti ti-send"></i> 제보 올리기</button>
                </form>`;
            },

            board(cat = '전체') {
                const list = db.posts.filter((p) => cat === '전체' || p.cat === cat).sort((a, b) => b.at - a.at);
                const chips = ['전체', ...BOARD_CATS]
                    .map((c) => `<button class="chip ${c === cat ? 'on' : ''}" onclick="$('#view').innerHTML = pages.board('${c}')">${c}</button>`).join('');
                return `
                <div class="chips">${chips}</div>
                <div class="list">${list.map(postCard).join('') || empty('messages', '아직 글이 없어요. 첫 글을 남겨보세요!')}</div>`;
            },

            post(id) {
                const p = db.posts.find((x) => x.id === id);
                if (!p) return empty('file-off', '글을 찾을 수 없어요');
                setTitle(p.cat);
                const liked = !!db.liked[p.id];
                return `
                <div class="card post">
                    <div class="cat">${esc(p.cat)}</div>
                    <div class="title" style="font-size:18px">${esc(p.title)}</div>
                    <div class="foot" style="margin-top:0"><span>${esc(p.author)}</span><span>${ago(p.at)}</span></div>
                    <div class="post-body">${esc(p.body)}</div>
                    <button class="like ${liked ? 'on' : ''}" onclick="toggleLike('${p.id}')"><i class="ti ti-heart${liked ? '-filled' : ''}"></i> 공감 ${p.likes}</button>
                </div>
                <h2>댓글 ${p.comments.length}</h2>
                <div class="card">
                    ${p.comments.map((c) => `<div class="comment"><div class="who">${esc(c.author)}<span>${ago(c.at)}</span></div><p>${esc(c.body)}</p></div>`).join('') || '<div style="color:var(--text3);font-size:14px">첫 댓글을 남겨주세요.</div>'}
                    <form class="comment-form" onsubmit="addComment(event, '${p.id}')">
                        <input name="body" maxlength="300" placeholder="댓글 쓰기" required>
                        <button class="btn" type="submit">등록</button>
                    </form>
                </div>`;
            },

            write() {
                return `
                <form onsubmit="submitPost(event)">
                    <div class="field">
                        <label>말머리</label>
                        <div class="chips" id="catChips">${BOARD_CATS.map((c, i) => `<button type="button" class="chip ${i === 0 ? 'on' : ''}" data-v="${c}" onclick="pickCat(this)">${c}</button>`).join('')}</div>
                    </div>
                    <div class="field">
                        <label>제목</label>
                        <input name="title" required maxlength="60" placeholder="제목을 입력하세요">
                    </div>
                    <div class="field">
                        <label>내용</label>
                        <textarea name="body" required maxlength="2000" style="min-height:200px" placeholder="경험이나 궁금한 점을 나눠주세요."></textarea>
                        <div class="hint">특정인을 비방하거나 개인정보를 올리는 글은 삭제될 수 있어요.</div>
                    </div>
                    <button class="btn block" type="submit"><i class="ti ti-send"></i> 올리기</button>
                </form>`;
            },

            guide() {
                const sec = (icon, title, items) => `
                <div class="card guide">
                    <h3><i class="ti ti-${icon}"></i>${title}</h3>
                    <ul>${items.map((t) => `<li>${t}</li>`).join('')}</ul>
                </div>`;
                return `
                <div class="list">
                    ${sec('camera', '증거부터 남기기', [
                        '가게 도착 시각과 음식을 받은 시각을 기록해 두세요. 앱 화면 캡처도 좋아요.',
                        '받자마자 포장 상태를 사진으로 찍어두면 누락·파손 책임 전가를 막을 수 있어요.',
                        '폭언을 들었다면 날짜·시간·내용을 바로 메모해 두세요.',
                    ])}
                    ${sec('clock-pause', '조리가 너무 늦을 때', [
                        '가게에 예상 시간을 한 번 확인하고, 그 답변을 기억해 두세요.',
                        '대기가 길어지면 배달 앱 고객센터(라이더 센터)에 상황을 알리세요. 기록이 남아야 나중에 불이익을 다툴 수 있어요.',
                        '무리하게 기다리다 과속하지 마세요. 늦어진 이유는 가게 쪽에 있어요.',
                    ])}
                    ${sec('message-off', '폭언·부당한 대우를 받았을 때', [
                        '맞대응하기보다 자리를 피하고 기록을 남기는 게 안전해요.',
                        '소속 플랫폼이나 배달대행사에 정식으로 신고하세요.',
                        '픽업노트에 제보해 다른 라이더도 미리 알 수 있게 해주세요.',
                    ])}
                    ${sec('phone', '도움받을 수 있는 곳', [
                        '배달 앱 라이더 고객센터 / 소속 배달대행사',
                        '고용노동부 고객상담센터 ☎ 1350 (노동 관련 상담)',
                        '위급한 상황이면 112',
                    ])}
                    ${sec('users', '커뮤니티 약속', [
                        '겪은 일을 사실대로만 적어요.',
                        '직원 실명, 전화번호, 얼굴 사진은 올리지 않아요.',
                        '욕설 대신 구체적인 상황을 적는 게 더 힘이 돼요.',
                    ])}
                </div>`;
            },
        };

        // ─── 동작 ─────────────────────────────────────────────
        let form = null;
        function setScore(n) {
            form.score = n;
            document.querySelectorAll('#rating button').forEach((b) => b.classList.toggle('on', +b.dataset.v === n));
        }
        function toggleTag(type, btn) {
            const t = btn.textContent;
            form[type].has(t) ? form[type].delete(t) : form[type].add(t);
            btn.classList.toggle('on');
        }
        function submitReport(e) {
            e.preventDefault();
            const f = new FormData(e.target);
            if (!form.score) return toast('라이더 대우 점수를 골라주세요');
            const r = {
                id: uid(),
                store: f.get('store').trim(),
                area: f.get('area').trim(),
                category: f.get('category'),
                wait: Math.max(0, Math.min(180, parseInt(f.get('wait'), 10) || 0)),
                score: form.score,
                bad: [...form.bad],
                good: [...form.good],
                memo: f.get('memo').trim(),
                at: Date.now(),
                author: db.nick,
            };
            // 같은 가게로 묶이도록 기존 표기를 따라감
            const existing = db.reports.find((x) => storeKey(x.store, x.area) === storeKey(r.store, r.area));
            if (existing) { r.store = existing.store; r.area = existing.area; }
            db.reports.push(r);
            save();
            toast('제보가 등록됐어요. 고마워요!');
            go('#store/' + encodeURIComponent(storeKey(r.store, r.area)));
        }
        function pickCat(btn) {
            document.querySelectorAll('#catChips .chip').forEach((b) => b.classList.remove('on'));
            btn.classList.add('on');
        }
        function submitPost(e) {
            e.preventDefault();
            const f = new FormData(e.target);
            const p = {
                id: uid(),
                cat: $('#catChips .chip.on').dataset.v,
                title: f.get('title').trim(),
                body: f.get('body').trim(),
                author: db.nick,
                at: Date.now(),
                likes: 0,
                comments: [],
            };
            if (!p.title || !p.body) return toast('제목과 내용을 입력해주세요');
            db.posts.push(p);
            save();
            toast('글이 올라갔어요');
            go('#post/' + p.id);
        }
        function toggleLike(id) {
            const p = db.posts.find((x) => x.id === id);
            if (db.liked[id]) { delete db.liked[id]; p.likes--; } else { db.liked[id] = true; p.likes++; }
            save();
            render();
        }
        function addComment(e, id) {
            e.preventDefault();
            const body = new FormData(e.target).get('body').trim();
            if (!body) return;
            db.posts.find((x) => x.id === id).comments.push({ author: db.nick, body, at: Date.now() });
            save();
            render();
        }
        function changeNick() {
            const n = prompt('닉네임을 바꿀까요? (실명은 피해주세요)', db.nick);
            if (n && n.trim()) {
                db.nick = n.trim().slice(0, 12);
                save();
                $('#nickText').textContent = db.nick;
            }
        }

        // ─── 라우터 ───────────────────────────────────────────
        const TITLES = { home: null, stores: '가게 평판', report: '가게 제보', board: '커뮤니티', write: '글쓰기', guide: '대처법', store: '', post: '' };
        function setTitle(t) { $('#title').innerHTML = t === null ? '<span class="logo">●</span> 픽업노트' : esc(t); }

        function render() {
            const [route, arg] = (location.hash.slice(1) || 'home').split('/');
            const page = pages[route] && TITLES.hasOwnProperty(route) ? route : 'home';
            const param = arg ? decodeURIComponent(arg) : undefined;
            setTitle(TITLES[page]);
            $('#topbar').classList.toggle('sub', ['store', 'post', 'write'].includes(page) || (page === 'report' && !!param));
            if (page === 'stores') { pages._q = ''; pages._f = '전체'; }
            $('#view').innerHTML = pages[page](param);
            const tab = { store: 'stores', post: 'board', write: 'board' }[page] || page;
            document.querySelectorAll('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
            $('#fab').classList.toggle('show', page === 'board');
            $('#nickText').textContent = db.nick;
        }
        let lastRoute = '';
        window.addEventListener('hashchange', () => {
            render();
            if (location.hash !== lastRoute) window.scrollTo(0, 0);
            lastRoute = location.hash;
        });
        render();
    </script>
</body>
</html>
